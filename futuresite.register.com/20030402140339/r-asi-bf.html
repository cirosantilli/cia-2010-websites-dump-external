		var noPop=0;    // when noPopup=1 do not popup window
		var PopupAd="http://www.register.com/promo/futuresite-popup.html";
		var isNav=(navigator.appName.indexOf("Netscape") != -1);
		var isIE=(navigator.appName.indexOf("Microsoft") != -1);
		var isNav6_up=0;

		if ( isNav) {
			// this is NS browser and will not get popup
			noPop=1;
		}
		if ( isNav && document.getElementById ) {
			// this is NS 6+ browser and will not get popup
			isNav6_up=1;
			noPop=1;
		}

		function goPop() {
			if ( noPop==0 ) {		
				var w = window.open("",'wwin','toolbar=0,location=0,directories=0,status=0,menubar=0,scrollbars=0,resizable=0,width=5,height=5,screenY=100,screenX=100,left=100,top=100');
				w.blur();
				w.location=PopupAd;
			}
		}

		function handler(e) {
			// event handling for IE users STARTS
			if (isIE) {
				e=window.event;		
				if(e.type == "click" || e.type == "dblclick") {
					if(e.srcElement==document.images[0] || document.images || e.srcElement.name=="chk_domain" || e.srcElement.name=="go" || document.links ) 
						{  
						noPop=1;  }
				}
				if(e.type == "unload") { 
					if((e.clientX > 0 && e.clientX < 120) && e.clientY < 0 ) {  noPop=1; }
					goPop();
				}
				e.cancelBubble=true;
			}	
			// event handling for IE users ENDS
		}

		function addhandlers(o) {
			o.onabort=handler;	
			o.onclick=handler;
			o.ondblclick=handler;	
			o.onerror=handler;
			o.onsubmit=handler;
			o.onunload=handler;
		}

		function starthandlers() {
			if (isIE) {
				addhandlers(window);
				addhandlers(document);
				for(var d=0; d < document.links.length; d++)
					addhandlers(document.links[d]);
				for(var d=0; d < document.images.length; d++)
					addhandlers(document.images[d]);
				for(var d=0; d < document.forms.length; d++) {
					addhandlers(document.forms[d]);
					for(var e=0; e < document.forms[d].elements.length; e++) 
						addhandlers(document.forms[d].elements[e]);
				}
			}
		}
	</script>

	<script language="JavaScript">
		function URLName() {
			 var patten = /domain=([a-zA-Z\-\d\.]+)/;
			 var url_string = window.location.toString();
			 var result = url_string.match(patten);
			 if (result != null) {
				var domain = result[1];
				var domain_element = domain.split(".");
				var total_domain_element = domain_element.length;
				if (total_domain_element == 0) {
					return null;
				} else if (total_domain_element == 2) {
					return domain;
				} else {
					total_domain_element = total_domain_element - 2;
					if ((domain_element[total_domain_element] == 'com') || 
						(domain_element[total_domain_element] == 'co') || 
						(domain_element[total_domain_element] == 'net') || 
						(domain_element[total_domain_element] == 'org') ) {
						domain = domain_element[total_domain_element - 1] + '.' + domain_element[total_domain_element] + '.' + domain_element[total_domain_element + 1];
					} else {
						domain = domain_element[total_domain_element] + '.' + domain_element[total_domain_element + 1];
					}
					return domain;
				}
			 } else {
				return null;
			 }
		}
	</script>
